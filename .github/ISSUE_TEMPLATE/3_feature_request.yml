name: Feature request
description: Suggest a new sensor, filter option, or improvement.
title: "[Feature] "
labels: ["enhancement"]
type: "feature"
body:
  - type: markdown
    attributes:
      value: |
        Please search [existing issues](https://github.com/MixasikM/ha-aruba-instant/issues) first to see if this enhancement has already been requested.

  - type: markdown
    attributes:
      value: |
        # Feature Proposal

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What Home Assistant use case or limitation does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like it to behave in the integration UI, entities, or options.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any screenshots, Aruba CLI capabilities, or examples.
