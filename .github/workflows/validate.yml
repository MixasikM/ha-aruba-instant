name: Validate

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest aiohttp voluptuous pillow propcache yarl asyncssh
      - name: Run pytest
        run: pytest -v

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  release-zip:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build aruba_instant.zip release asset
        run: |
          cd custom_components/aruba_instant
          zip -r ../../aruba_instant.zip . -x '*/__pycache__/*' '*.pyc'
      - name: Upload aruba_instant.zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" aruba_instant.zip --clobber
