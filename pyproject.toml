[project]
name = "ha-aruba-instant"
version = "0.3.1"
description = "Modern asynchronous Home Assistant integration for HPE Aruba Instant & AOS Wi-Fi access points."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["scratch", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
